<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 240" role="img"
     aria-label="Diagram contrasting quick chemical quieting of anxiety with gradual strengthening of coping and regulation circuits through therapy and SSRIs.">
  <title>Chemical Quieting vs Learning Recovery</title>
  <rect width="520" height="240" fill="#f8f9fb" rx="12"/>
  <text x="260" y="24" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#1a2232" text-anchor="middle">Two Different Kinds of Change</text>
  <rect x="20" y="40" width="220" height="155" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5" rx="10"/>
  <text x="130" y="65" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle">Chemical Quieting</text>
  <text x="130" y="83" font-family="system-ui,sans-serif" font-size="10.5" fill="#555" text-anchor="middle">(Benzodiazepines)</text>
  <text x="130" y="118" font-family="system-ui,sans-serif" font-size="28" fill="#ef4444" text-anchor="middle">&#8595;</text>
  <text x="130" y="142" font-family="system-ui,sans-serif" font-size="10.5" fill="#555" text-anchor="middle">Alarm turned down fast</text>
  <text x="130" y="158" font-family="system-ui,sans-serif" font-size="10.5" fill="#555" text-anchor="middle">No new coping skills built</text>
  <text x="130" y="180" font-family="system-ui,sans-serif" font-size="9.5" fill="#991b1b" text-anchor="middle" font-style="italic">Brain adapts, may need more</text>
  <rect x="280" y="40" width="220" height="155" fill="#d1fae5" stroke="#059669" stroke-width="1.5" rx="10"/>
  <text x="390" y="65" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#065f46" text-anchor="middle">Learning Recovery</text>
  <text x="390" y="83" font-family="system-ui,sans-serif" font-size="10.5" fill="#555" text-anchor="middle">(Therapy + SSRIs + Practice)</text>
  <text x="390" y="118" font-family="system-ui,sans-serif" font-size="28" fill="#059669" text-anchor="middle">&#8593;</text>
  <text x="390" y="142" font-family="system-ui,sans-serif" font-size="10.5" fill="#555" text-anchor="middle">Regulation circuits strengthen</text>
  <text x="390" y="158" font-family="system-ui,sans-serif" font-size="10.5" fill="#555" text-anchor="middle">Coping skills grow over time</text>
  <text x="390" y="180" font-family="system-ui,sans-serif" font-size="9.5" fill="#065f46" text-anchor="middle" font-style="italic">Slower, but builds lasting change</text>
  <text x="260" y="122" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#6b7280" text-anchor="middle">vs</text>
  <text x="260" y="215" font-family="system-ui,sans-serif" font-size="10" fill="#888" text-anchor="middle" font-style="italic">Turning the alarm down fast is different from training the brain to respond differently.</text>
</svg>