<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" role="img"
     aria-label="Simple diagram showing the amygdala as a fast alarm, insula as body-signal reader, hippocampus as memory and context, and prefrontal cortex as pause-and-choose system.">
  <title>Anxiety Circuit Diagram</title>
  <defs>
    <marker id="arr-g" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0,8 3,0 6" fill="#6b7280"/>
    </marker>
    <marker id="arr-b" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0,8 3,0 6" fill="#2563eb"/>
    </marker>
  </defs>
  <rect width="520" height="300" fill="#f8f9fb" rx="12"/>
  <text x="260" y="24" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#1a2232" text-anchor="middle">Anxiety and Regulation Circuit</text>
  <rect x="20" y="90" width="130" height="68" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5" rx="10"/>
  <text x="85" y="117" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#991b1b" text-anchor="middle">Amygdala</text>
  <text x="85" y="133" font-family="system-ui,sans-serif" font-size="10.5" fill="#555" text-anchor="middle">Fast Alarm</text>
  <text x="85" y="149" font-family="system-ui,sans-serif" font-size="10.5" fill="#555" text-anchor="middle">Threat detection</text>
  <rect x="185" y="35" width="140" height="68" fill="#fef3c7" stroke="#d97706" stroke-width="1.5" rx="10"/>
  <text x="255" y="62" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#92400e" text-anchor="middle">Insula</text>
  <text x="255" y="78" font-family="system-ui,sans-serif" font-size="10.5" fill="#555" text-anchor="middle">Body Signal Reader</text>
  <text x="255" y="94" font-family="system-ui,sans-serif" font-size="10.5" fill="#555" text-anchor="middle">Heart, breath, gut</text>
  <rect x="185" y="175" width="140" height="68" fill="#d1fae5" stroke="#059669" stroke-width="1.5" rx="10"/>
  <text x="255" y="202" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#065f46" text-anchor="middle">Hippocampus</text>
  <text x="255" y="218" font-family="system-ui,sans-serif" font-size="10.5" fill="#555" text-anchor="middle">Memory and Context</text>
  <text x="255" y="234" font-family="system-ui,sans-serif" font-size="10.5" fill="#555" text-anchor="middle">Fear learning</text>
  <rect x="360" y="90" width="140" height="68" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" rx="10"/>
  <text x="430" y="117" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#1e3a8a" text-anchor="middle">Prefrontal Cortex</text>
  <text x="430" y="133" font-family="system-ui,sans-serif" font-size="10.5" fill="#555" text-anchor="middle">Pause and Evaluate</text>
  <text x="430" y="149" font-family="system-ui,sans-serif" font-size="10.5" fill="#555" text-anchor="middle">Choose a response</text>
  <path d="M110,90 Q155,60 185,62" stroke="#d97706" stroke-width="2" fill="none" marker-end="url(#arr-g)"/>
  <path d="M110,158 Q155,195 185,200" stroke="#059669" stroke-width="2" fill="none" marker-end="url(#arr-g)"/>
  <path d="M150,124 Q255,105 360,124" stroke="#6b7280" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arr-g)"/>
  <path d="M360,140 Q255,162 150,144" stroke="#2563eb" stroke-width="2" fill="none" stroke-dasharray="5,3" marker-end="url(#arr-b)"/>
  <rect x="20" y="258" width="480" height="30" fill="#fff" stroke="#dde3ed" stroke-width="1" rx="7"/>
  <text x="260" y="277" font-family="system-ui,sans-serif" font-size="10" fill="#888" text-anchor="middle" font-style="italic">Recovery builds the pause-and-choose system. Practice strengthens regulation over time.</text>
</svg>