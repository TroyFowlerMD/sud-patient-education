<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 260" role="img"
     aria-label="Diagram comparing repeated therapy practice to repeated workout repetitions that build strength over time.">
  <title>Therapy Is a Workout</title>
  <rect width="520" height="260" fill="#f8f9fb" rx="12"/>
  <text x="260" y="24" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#1a2232" text-anchor="middle">Therapy Is Practice - Repeated Reps Change the Brain</text>
  <rect x="20" y="40" width="220" height="170" fill="#fff" stroke="#dde3ed" stroke-width="1.5" rx="10"/>
  <text x="130" y="65" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle">One Visit</text>
  <text x="130" y="83" font-family="system-ui,sans-serif" font-size="10.5" fill="#888" text-anchor="middle">One gym trip = little change</text>
  <rect x="105" y="95" width="50" height="12" fill="#e5e7eb" rx="4"/>
  <rect x="98" y="90" width="14" height="22" fill="#9ca3af" rx="3"/>
  <rect x="148" y="90" width="14" height="22" fill="#9ca3af" rx="3"/>
  <text x="130" y="135" font-family="system-ui,sans-serif" font-size="10" fill="#888" text-anchor="middle">One coping skill practice</text>
  <text x="130" y="150" font-family="system-ui,sans-serif" font-size="10" fill="#888" text-anchor="middle">= small shift</text>
  <text x="130" y="190" font-family="system-ui,sans-serif" font-size="22" fill="#d1d5db" text-anchor="middle">~</text>
  <rect x="280" y="40" width="220" height="170" fill="#edf6ff" stroke="#2563eb" stroke-width="1.5" rx="10"/>
  <text x="390" y="65" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#1e3a8a" text-anchor="middle">Repeated Practice</text>
  <text x="390" y="83" font-family="system-ui,sans-serif" font-size="10.5" fill="#555" text-anchor="middle">Repeated reps build strength</text>
  <rect x="305" y="95" width="170" height="9" fill="#bfdbfe" rx="4"/>
  <rect x="305" y="95" width="60" height="9" fill="#2563eb" rx="4"/>
  <text x="390" y="118" font-family="system-ui,sans-serif" font-size="9.5" fill="#555" text-anchor="middle">Exposure reps</text>
  <rect x="305" y="125" width="170" height="9" fill="#bfdbfe" rx="4"/>
  <rect x="305" y="125" width="100" height="9" fill="#2563eb" rx="4"/>
  <text x="390" y="148" font-family="system-ui,sans-serif" font-size="9.5" fill="#555" text-anchor="middle">Mindfulness + cognitive reps</text>
  <rect x="305" y="155" width="170" height="9" fill="#bfdbfe" rx="4"/>
  <rect x="305" y="155" width="145" height="9" fill="#0e7c6b" rx="4"/>
  <text x="390" y="178" font-family="system-ui,sans-serif" font-size="9.5" fill="#555" text-anchor="middle">Distress tolerance + urge-surfing</text>
  <path d="M242,125 L276,125" stroke="#6b7280" stroke-width="2" fill="none" marker-end="url(#arr-wk)"/>
  <defs>
    <marker id="arr-wk" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0,8 3,0 6" fill="#6b7280"/>
    </marker>
  </defs>
  <text x="260" y="230" font-family="system-ui,sans-serif" font-size="10" fill="#888" text-anchor="middle" font-style="italic">Practice changes the anxiety-regulation system. Progress builds over time.</text>
</svg>